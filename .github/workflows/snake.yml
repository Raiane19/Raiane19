name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Raiane19
          outputs: |
            dist/github-snake.svg?color_snake=#FF4FA3&color_dots=#FCE7F3,#F9A8D4,#C084FC,#8B5CF6,#3B82F6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4FA3&color_dots=#FCE7F3,#F9A8D4,#C084FC,#8B5CF6,#3B82F6

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
